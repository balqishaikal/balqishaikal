<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="275" viewBox="0 0 1400 275">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8E54E9"/>
      <stop offset=".55" stop-color="#7C8CFF"/>
      <stop offset="1" stop-color="#4F8CFF"/>
    </linearGradient>

    <radialGradient id="glowPurple">
      <stop offset="0" stop-color="#8E54E9" stop-opacity=".35"/>
      <stop offset=".5" stop-color="#8E54E9" stop-opacity=".12"/>
      <stop offset="1" stop-color="#8E54E9" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowBlue">
      <stop offset="0" stop-color="#4F8CFF" stop-opacity=".3"/>
      <stop offset=".5" stop-color="#4F8CFF" stop-opacity=".1"/>
      <stop offset="1" stop-color="#4F8CFF" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect
    x="12" y="12"
    width="1376"
    height="250"
    rx="28"
    fill="#0D0B18"
    stroke="#332B4C"
    stroke-width="2"
  />

  <!-- LEFT GLOW -->
  <circle cx="220" cy="125" r="120" fill="url(#glowPurple)">
    <animate
      attributeName="r"
      values="95;135;95"
      dur="5s"
      repeatCount="indefinite"
    />
    <animate
      attributeName="opacity"
      values=".65;1;.65"
      dur="5s"
      repeatCount="indefinite"
    />
  </circle>

  <!-- LEFT MAIN ORBIT -->
  <g transform="translate(220 125)">
    <circle
      r="78"
      fill="none"
      stroke="#8E54E9"
      stroke-width="1"
      stroke-opacity=".18"
      stroke-dasharray="4 10"
    >
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0"
        to="360"
        dur="12s"
        repeatCount="indefinite"
      />
    </circle>

    <circle
      r="58"
      fill="none"
      stroke="#7C8CFF"
      stroke-width="1"
      stroke-opacity=".2"
    >
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="360"
        to="0"
        dur="9s"
        repeatCount="indefinite"
      />
    </circle>

    <!-- Orbiting dot -->
    <g>
      <circle cx="78" cy="0" r="4" fill="#A979FF">
        <animateTransform
          attributeName="transform"
          type="rotate"
          from="0"
          to="360"
          dur="6s"
          repeatCount="indefinite"
        />
      </circle>
    </g>

    <!-- Inner pulsing circle -->
    <circle r="35" fill="#8E54E9" opacity=".08">
      <animate
        attributeName="r"
        values="25;42;25"
        dur="3s"
        repeatCount="indefinite"
      />
      <animate
        attributeName="opacity"
        values=".05;.16;.05"
        dur="3s"
        repeatCount="indefinite"
      />
    </circle>
  </g>

  <!-- LEFT FLOATING PARTICLES -->
  <circle cx="115" cy="75" r="2" fill="#A979FF">
    <animate
      attributeName="cy"
      values="75;55;75"
      dur="4s"
      repeatCount="indefinite"
    />
    <animate
      attributeName="opacity"
      values=".2;1;.2"
      dur="4s"
      repeatCount="indefinite"
    />
  </circle>

  <circle cx="315" cy="190" r="2.5" fill="#7C8CFF">
    <animate
      attributeName="cy"
      values="190;165;190"
      dur="4.5s"
      repeatCount="indefinite"
    />
    <animate
      attributeName="opacity"
      values=".2;.9;.2"
      dur="4.5s"
      repeatCount="indefinite"
    />
  </circle>

  <!-- RIGHT GLOW -->
  <circle cx="1180" cy="150" r="130" fill="url(#glowBlue)">
    <animate
      attributeName="r"
      values="105;145;105"
      dur="6s"
      repeatCount="indefinite"
    />
    <animate
      attributeName="opacity"
      values=".6;1;.6"
      dur="6s"
      repeatCount="indefinite"
    />
  </circle>

  <!-- RIGHT ORBIT -->
  <g transform="translate(1180 150)">
    <circle
      r="85"
      fill="none"
      stroke="#4F8CFF"
      stroke-width="1"
      stroke-opacity=".16"
      stroke-dasharray="3 12"
    >
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="360"
        to="0"
        dur="14s"
        repeatCount="indefinite"
      />
    </circle>

    <circle
      r="60"
      fill="none"
      stroke="#7C8CFF"
      stroke-width="1"
      stroke-opacity=".2"
    >
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0"
        to="360"
        dur="10s"
        repeatCount="indefinite"
      />
    </circle>

    <!-- Orbiting dot -->
    <g>
      <circle cx="85" cy="0" r="4" fill="#6FA8FF">
        <animateTransform
          attributeName="transform"
          type="rotate"
          from="0"
          to="360"
          dur="7s"
          repeatCount="indefinite"
        />
      </circle>
    </g>

    <circle r="38" fill="#4F8CFF" opacity=".07">
      <animate
        attributeName="r"
        values="28;45;28"
        dur="3.5s"
        repeatCount="indefinite"
      />
      <animate
        attributeName="opacity"
        values=".04;.14;.04"
        dur="3.5s"
        repeatCount="indefinite"
      />
    </circle>
  </g>

  <!-- RIGHT PARTICLES -->
  <circle cx="1300" cy="90" r="2" fill="#6FA8FF">
    <animate
      attributeName="cy"
      values="90;65;90"
      dur="5s"
      repeatCount="indefinite"
    />
    <animate
      attributeName="opacity"
      values=".2;1;.2"
      dur="5s"
      repeatCount="indefinite"
    />
  </circle>

  <circle cx="1080" cy="215" r="2.5" fill="#8DB8FF">
    <animate
      attributeName="cy"
      values="215;190;215"
      dur="4s"
      repeatCount="indefinite"
    />
    <animate
      attributeName="opacity"
      values=".15;.9;.15"
      dur="4s"
      repeatCount="indefinite"
    />
  </circle>

  <!-- TEXT -->
  <text
    x="700"
    y="105"
    text-anchor="middle"
    fill="#8DB8FF"
    font-family="Arial"
    font-size="15"
    font-weight="700"
    letter-spacing="4"
  >
    BALQIS.DEV
  </text>

  <text
    x="700"
    y="160"
    text-anchor="middle"
    fill="#FFF"
    font-family="Arial"
    font-size="34"
    font-weight="800"
  >
    LET'S BUILD SOMETHING
  </text>

  <text
    x="700"
    y="198"
    text-anchor="middle"
    fill="#AAA4BC"
    font-family="Arial"
    font-size="16"
  >
    Software Engineering × Product × UI/UX
  </text>
</svg>
