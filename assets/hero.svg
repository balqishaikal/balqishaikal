<svg width="1000" height="320" viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8E54E9" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8E54E9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F8CFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4F8CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E4D9FF"/>
    </linearGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="dotGrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#8E54E9" opacity="0.18"/>
    </pattern>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="1000" height="320" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="1000" height="320" fill="#0D0B18"/>
    <rect width="1000" height="320" fill="url(#dotGrid)"/>

    <circle cx="230" cy="80" r="180" fill="url(#glowPurple)" filter="url(#softBlur)">
      <animate attributeName="r" values="170;200;170" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780" cy="110" r="160" fill="url(#glowBlue)" filter="url(#softBlur)">
      <animate attributeName="r" values="150;180;150" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="8s" repeatCount="indefinite"/>
    </circle>

    <!-- corner brackets -->
    <g stroke="#8E54E9" stroke-width="2" opacity="0.55" fill="none">
      <path d="M32,56 L32,32 L56,32"/>
      <path d="M944,32 L968,32 L968,56"/>
      <path d="M32,264 L32,288 L56,288"/>
      <path d="M944,288 L968,288 L968,264"/>
    </g>

    <!-- glow text layer -->
    <text x="500" y="150" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="800" font-size="88" letter-spacing="10" fill="#8E54E9" opacity="0.65" filter="url(#textGlow)">BALQIS</text>
    <!-- crisp text layer -->
    <text x="500" y="150" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="800" font-size="88" letter-spacing="10" fill="url(#titleGrad)">BALQIS</text>

    <text x="500" y="188" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="600" font-size="19" letter-spacing="5" fill="#8DB8FF">SOFTWARE ENGINEERING × PRODUCT × UI/UX</text>

    <text x="500" y="220" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#B9B4D6">Building thoughtful digital products where code meets people.</text>

    <text x="500" y="268" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#6C63A8">&gt; initializing balqis.dev_</text>
    <rect x="628" y="256" width="9" height="16" fill="#8E54E9">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.3s" repeatCount="indefinite"/>
    </rect>

    <rect x="0.5" y="0.5" width="999" height="319" rx="22" fill="none" stroke="#8E54E9" stroke-opacity="0.25"/>
  </g>
</svg>
