<defs>
  <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#6D3FD4"/>
    <stop offset="50%" stop-color="#8E54E9"/>
    <stop offset="100%" stop-color="#4F8CFF"/>
  </linearGradient>

  <linearGradient id="activity" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#8E54E9"/>
