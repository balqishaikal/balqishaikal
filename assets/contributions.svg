<svg xmlns="http://www.w3.org/2000/svg"
     width="1400"
     height="350"
     viewBox="0 0 1400 350">

<defs>
  <linearGradient id="activity" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#8E54E9"/>
    <stop offset=".5" stop-color="#A66CFF"/>
    <stop offset="1" stop-color="#4F8CFF"/>
  </linearGradient>

  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="12"/>
  </filter>

  <radialGradient id="bgGlow" cx="75%" cy="45%" r="65%">
    <stop offset="0%" stop-color="#242044"/>
    <stop offset="45%" stop-color="#111326"/>
    <stop offset="100%" stop-color="#0D0B18"/>
  </radialGradient>
</defs>

<rect width="1400" height="350" rx="28" fill="url(#bgGlow)"/>

<ellipse cx="1130" cy="175" rx="260" ry="120"
